name: Weekly Traffic Report

on:
  schedule:
    # 13:00 UTC = 8am America/Chicago during CDT (roughly Mar-Nov).
    # During CST (roughly Nov-Mar) this lands at 7am Central instead of 8am;
    # GitHub Actions cron doesn't follow DST. Adjust if that drift matters.
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Run report
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GA_PROPERTY_ID: '545440442'
          GMAIL_ADDRESS: 'bje001@gmail.com'
          RECIPIENT_EMAIL: 'bje001@gmail.com'
        run: python3 scripts/traffic_report.py
